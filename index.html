<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>護理之家排班</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --line:#e3e6ec; --line2:#eef0f4;
  --text:#1b2030; --mute:#6b7285; --accent:#2f5bd8; --accent-bg:#ecf1fe;
  --bad:#c81e3a; --bad-bg:#fdecef; --warn:#a15c00; --warn-bg:#fff4dc; --ok:#12804a; --ok-bg:#e3f6ec;
  --rest:#fafbfd; --r:10px; --leave:#0d9488;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--bad)} .btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=password],input[type=number],select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=number]{width:74px}
.mute{color:var(--mute)} .small{font-size:12.5px}

/* 登入 */
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login-box{width:360px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.login-box h1{font-size:20px;margin-bottom:2px}
.login-box label{display:block;font-size:12.5px;color:var(--mute);margin:16px 0 5px}
.login-box select,.login-box input{width:100%}
.login-box .btn{width:100%;margin-top:10px}
.or{text-align:center;color:var(--mute);font-size:12px;margin:18px 0 0}
.notice{border-radius:8px;padding:9px 12px;font-size:13px;margin-top:12px}
.notice.open{background:var(--accent-bg);color:var(--accent)} .notice.closed{background:var(--warn-bg);color:var(--warn)}

/* 外框 */
header{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;height:52px}
header .brand{font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.tab{border:0;background:none;padding:15px 12px;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.who{font-size:13px;color:var(--mute);white-space:nowrap}
main{padding:16px;max-width:1500px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px}
.bar .sp{flex:1}
.month{display:flex;align-items:center;gap:4px;font-weight:700;font-size:16px}
.month .btn{padding:4px 10px}
.month span{min-width:104px;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px}
.card h3{font-size:14px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border-radius:999px;padding:3px 11px;font-size:12.5px;font-weight:600;background:var(--line2);color:var(--mute)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.ok{background:var(--ok-bg);color:var(--ok)}
.cap{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-bottom:12px}
.cap .card{margin:0}
.cap b{font-size:15px}

/* 班表 */
.grid-wrap{overflow:auto;max-height:calc(100vh - 210px);background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.grid th,.grid td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:center;padding:0;height:30px;min-width:31px}
.grid thead th{position:sticky;top:0;z-index:3;background:#fff;font-weight:600;height:24px}
.grid thead tr:nth-child(2) th{top:24px;border-bottom:1px solid var(--line)}
.grid .name{position:sticky;left:0;z-index:2;background:#fff;text-align:left;padding:0 10px;min-width:104px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;border-right:1px solid var(--line)}
.grid thead .name{z-index:4}
.grid .rest{background:var(--rest);color:var(--bad)}
.grid td.c{cursor:pointer;font-weight:700;position:relative}
.grid td.c:hover{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
.grid td.ro{cursor:default} .grid td.ro:hover{outline:none}
.grid td.vh{box-shadow:inset 0 0 0 2px var(--bad)}
.grid td.vs{box-shadow:inset 0 -3px 0 #e2a000}
.grid td.lock::after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:50%;background:#1b2030}
.grid td.req{box-shadow:inset 0 0 0 2px var(--leave)}
.grid td.req.vs{box-shadow:inset 0 0 0 2px var(--leave),inset 0 -5px 0 #e2a000}
.grid td.req.vh{box-shadow:inset 0 0 0 2px var(--bad),inset 0 0 0 4px var(--leave)}
.key{display:inline-block;width:14px;height:14px;border-radius:3px;box-shadow:inset 0 0 0 2px var(--leave);vertical-align:-2px;margin-right:4px}
.grid .prev{min-width:46px;padding:0 4px;font-weight:700;white-space:nowrap;border-right:2px solid var(--line);background:#fbfcfe;font-size:12px}
.grid th.prev{color:var(--mute);font-weight:600;line-height:1.15;font-size:11px}
.grid td.prev[data-act]{cursor:pointer}
.grid td.prev[data-act]:hover{background:var(--accent-bg)}
.grid td.prev small{font-weight:600;margin-left:1px;opacity:.8}
.grid td.prev.manual{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.grid td.stat{color:var(--mute);min-width:34px;font-variant-numeric:tabular-nums}
.grid th.stat{color:var(--mute);font-weight:500}
.grid tr.cov td{background:#fbfcfe;color:var(--mute);font-variant-numeric:tabular-nums}
.grid tr.cov td.name{background:#fbfcfe;font-weight:500}
.grid tr.cov td.low{background:var(--bad-bg);color:var(--bad);font-weight:700}
.grid tr.cov td.thin{background:var(--warn-bg);color:var(--warn);font-weight:700}
.grid tr.me td.name{background:var(--accent-bg);color:var(--accent)}
.grid tr.sep td{height:26px;background:var(--line2);text-align:left;padding:0 10px;font-weight:700;position:sticky;left:0}
.tag{font-size:10.5px;font-weight:600;color:var(--mute);margin-left:4px}
.viol{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.viol ul{margin:0;padding:0;list-style:none;max-height:260px;overflow:auto}
.viol li{padding:5px 0;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer}
.viol li:hover{color:var(--accent)}
.viol li:last-child{border:0}
details.card summary{cursor:pointer}
details.card[open] summary{margin-bottom:6px}
.explain{font-size:13px}
.explain p{margin:8px 0}
.explain table.list td{vertical-align:top}
.explain code{background:var(--line2);border-radius:4px;padding:1px 5px;font-family:inherit;font-weight:600}

/* 選班小視窗 */
#pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(20,30,60,.18);padding:12px;width:232px;display:none}
#pop .ttl{font-weight:700;margin-bottom:8px}
#pop .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#pop .o{border:1px solid transparent;border-radius:7px;padding:6px 0;font-weight:700;cursor:pointer;text-align:center}
#pop .o.cur{border-color:#1b2030}
#pop .o.dim{opacity:.35}
#pop label{display:flex;gap:6px;align-items:center;font-size:12.5px;margin-top:10px;cursor:pointer}
#pop .foot{display:flex;gap:6px;margin-top:10px}

/* 預假月曆 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:560px}
.cal .h{text-align:center;font-size:12px;color:var(--mute);padding:4px 0}
.cal .d{min-height:52px;padding:4px 0;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:16px;position:relative}
.cal .d small{font-size:10px;font-weight:500;color:var(--mute);max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-height:15px}
.cal .d.rest{color:var(--bad)}
.cal .d.sel{background:var(--bad);border-color:var(--bad);color:#fff} .cal .d.sel small{color:#ffd9df}
.cal .d.off{cursor:default;opacity:.55}

/* 人員、規則 */
table.list{width:100%;border-collapse:collapse}
.list th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.list td{padding:6px 8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.list tr.inactive td{opacity:.5}
.pick{display:inline-flex;flex-wrap:wrap;gap:4px}
.pick button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--mute)}
.pick button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rule{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line2)}
.rule:last-child{border:0}
.rule.off .body{opacity:.5}
.rule input.rname{width:100%;font-weight:600;border-color:transparent;padding-left:0;background:none}
.rule input.rname:hover,.rule input.rname:focus{border-color:var(--line);padding-left:10px;background:#fff}
.rule .params{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px;align-items:center}
.rule .params label{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute)}
.rstat{font-size:12.5px;margin-top:8px;color:var(--mute)}
.rstat.bad{color:var(--bad);font-weight:700;background:var(--bad-bg);border-radius:6px;padding:5px 9px;display:inline-block}
.rstat.warn{color:var(--warn)} .rstat.ok{color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:5px 10px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--text);color:#fff}
.sw{position:relative;width:36px;height:20px;border-radius:999px;background:#cfd4de;border:0;cursor:pointer;margin-top:6px;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--ok)} .sw.on::after{left:18px}
.form{display:grid;grid-template-columns:140px 1fr;gap:10px 14px;align-items:center;max-width:640px}
.form textarea{width:100%;min-height:90px}

#modal{position:fixed;inset:0;z-index:65;background:rgba(20,26,40,.45);display:none;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
#modal.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:20px;width:560px;max-width:100%}
.modal-box h3{font-size:16px;margin-bottom:4px}
.modal-box table.list td{padding:4px 8px}
.modal-box .grp td{background:var(--line2);font-weight:700;font-size:12.5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b2030;color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1} #toast.err{background:var(--bad)}
#busy{position:fixed;inset:0;background:rgba(246,247,249,.8);z-index:70;display:none;place-items:center;font-weight:700}
#busy.show{display:grid}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
@media (max-width:640px){main{padding:10px}.form{grid-template-columns:1fr}header{gap:8px;padding:0 10px}.who span{display:none}}
@media print{header,.bar,.viol,.cap,#toast{display:none!important}.grid-wrap{max-height:none;overflow:visible;border:0}main{padding:0;max-width:none}body{background:#fff}.grid .name,.grid thead th{position:static}}
</style>
</head>
<body>
<div id="app"></div>
<div id="pop"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="busy"><div id="busyText">處理中…</div></div>
<input type="file" id="fileIn" accept=".json" hidden>

<script src="engine.js"></script>
<script src="seed.js"></script>
<script type="module">
/* ============================================================
 * 護理之家排班系統 — 介面與資料層
 * 排班規則與演算法都在 engine.js；這個檔案只負責畫面、存取資料。
 * ============================================================ */

// 填入 Firebase 專案設定後，資料會改存 Firestore、跨裝置同步；留 null 則只存在這台瀏覽器。
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAKMQTHOrlqn3g_j-49Mp7ndOzWcYCO5PI",
  authDomain: "nursehome-8b74b.firebaseapp.com",
  projectId: "nursehome-8b74b",
  storageBucket: "nursehome-8b74b.firebasestorage.app",
  messagingSenderId: "884392588679",
  appId: "1:884392588679:web:144e7810b959ca7d494f22",
};
const FS_COLLECTION = 'nhSchedule';

const E = window.NHEngine, SEED = window.NH_SEED || null;
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = v => JSON.parse(JSON.stringify(v));
const pad = n => String(n).padStart(2, '0');
const ymKey = (y, m) => `${y}_${m}`;
const uid = p => p + Math.random().toString(36).slice(2, 8);
const tick = () => new Promise(r => setTimeout(r, 30));

// ── 資料層：兩種儲存方式介面相同 ─────────────────────────
const LocalStore = {
  mode: 'local',
  async get(k) { try { const v = localStorage.getItem('nhs:' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  async set(k, v) { localStorage.setItem('nhs:' + k, JSON.stringify(v)); },
  async del(k) { localStorage.removeItem('nhs:' + k); },
  async list(prefix) {
    const out = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith('nhs:' + prefix)) { try { out[k.slice(4)] = JSON.parse(localStorage.getItem(k)); } catch (e) {} }
    }
    return out;
  },
};
let Store = LocalStore, cloudError = '';
async function initStore() {
  if (!FIREBASE_CONFIG) return;
  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js');
    const fs = await import('https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js');
    const db = fs.getFirestore(initializeApp(FIREBASE_CONFIG));
    const ref = k => fs.doc(db, FS_COLLECTION, k);
    Store = {
      mode: 'cloud',
      async get(k) { const s = await fs.getDoc(ref(k)); return s.exists() ? JSON.parse(s.data().json) : null; },
      async set(k, v) { await fs.setDoc(ref(k), { json: JSON.stringify(v), at: new Date().toISOString() }); },
      async del(k) { await fs.deleteDoc(ref(k)); },
      async list(prefix) {
        const col = fs.collection(db, FS_COLLECTION);
        const q = prefix ? fs.query(col, fs.where(fs.documentId(), '>=', prefix), fs.where(fs.documentId(), '<', prefix + '\uf8ff')) : col;
        const out = {};
        (await fs.getDocs(q)).forEach(d => { out[d.id] = JSON.parse(d.data().json); });
        return out;
      },
    };
    // 先讀一次確認連得上（金鑰錯、規則沒開、沒網路都會在這裡失敗）
    await Promise.race([Store.get('config'), new Promise((_, rej) => setTimeout(() => rej(new Error('連線逾時')), 12000))]);
  } catch (e) {
    console.error(e);
    Store = LocalStore;
    cloudError = e.code || e.message || String(e);
  }
}

// ── 狀態 ─────────────────────────────────────────────────
const S = {
  cfg: null, staff: [], user: null, tab: 'sched',
  y: 0, m: 0, month: null, requests: {}, lock: null, prevTail: {},
  result: null, undo: [], group: 'all', leaveMode: false, seed: 1, focus: null, dirty: false,
};
function defaultCfg() {
  return { facility: (SEED && SEED.facility) || '護理之家', groups: clone(E.DEFAULT_GROUPS), shifts: clone(E.DEFAULT_SHIFTS),
    rules: clone(E.DEFAULT_RULES).concat(SEED ? clone(SEED.rules || []) : []), leave: { max: 0, lockDay: 10 }, holidays: {}, adminHash: '', ruleVer: 2 };
}
const emptyMonth = () => ({ cells: {}, locks: {}, prev: {}, savedAt: null, published: null });
const workShifts = g => S.cfg.shifts.filter(s => s.kind === 'work' && (!g || !s.group || s.group === g));
const offShifts = () => S.cfg.shifts.filter(s => s.kind === 'off' && s.enabled !== false);
const shiftOf = c => S.cfg.shifts.find(s => s.code === c);
const groupName = id => (S.cfg.groups.find(g => g.id === id) || {}).name || id;
const activeStaff = g => S.staff.filter(s => s.active !== false && (!g || g === 'all' || s.group === g));
const dim = () => E.daysInMonth(S.y, S.m);

async function loadAll() {
  const stored = await Store.get('config');
  S.cfg = Object.assign(defaultCfg(), stored || {});
  if (stored && !stored.ruleVer) S.cfg.ruleVer = 1;        // 舊設定：下面會補上新規則
  let staff = await Store.get('staff');
  if (!staff && SEED) {
    // 第一次開啟：載入機構人員名單與既有班表
    staff = clone(SEED.staff);
    await Store.set('staff', staff);
    for (const k of Object.keys(SEED.months || {})) {
      const mo = SEED.months[k];
      await Store.set('sched_' + k, { cells: mo.cells, locks: {}, savedAt: new Date().toISOString(), published: { cells: mo.cells, at: new Date().toISOString() }, imported: true });
      for (const id of Object.keys(mo.requests || {})) await Store.set(`req_${k}_${id}`, { days: mo.requests[id] });
    }
    await Store.set('config', S.cfg);
  }
  S.staff = staff || [];
  // 規則版本升級：補上後來才有的預設規則
  if ((S.cfg.ruleVer || 1) < 2) {
    // 之前用「每日班別人數」建、但沒選班別也沒填人數的規則沒有作用；名稱在講班別種類的，直接轉成新類型
    const stub = S.cfg.rules.find(r => r.type === 'codeCount' && !(r.params.codes || []).length && /種班別/.test(r.name || ''));
    if (stub) { stub.type = 'maxKinds'; stub.hard = false; stub.weight = +stub.weight || 6; stub.params = { group: 'all', max: 2 }; }
    else if (!S.cfg.rules.some(r => r.type === 'maxKinds')) {
      const def = E.DEFAULT_RULES.find(r => r.id === 'max-kinds'), at = S.cfg.rules.findIndex(r => r.type === 'preferShift');
      S.cfg.rules.splice(at < 0 ? S.cfg.rules.length : at, 0, clone(def));
    }
    S.cfg.ruleVer = 2;
    await Store.set('config', S.cfg);
  }
}
async function loadMonth() {
  const k = ymKey(S.y, S.m);
  S.month = Object.assign(emptyMonth(), await Store.get('sched_' + k) || {});
  const draft = readDraft(S.y, S.m);
  S.dirty = !!draft;
  if (draft) { S.month.cells = draft.cells || {}; S.month.locks = draft.locks || {}; S.month.prev = draft.prev || {}; }
  const reqs = await Store.list(`req_${k}_`);
  S.requests = {};
  Object.keys(reqs).forEach(key => { S.requests[key.slice(`req_${k}_`.length)] = reqs[key].days || []; });
  S.lock = await Store.get('lock_' + k);
  const py = S.m === 1 ? S.y - 1 : S.y, pm = S.m === 1 ? 12 : S.m - 1;
  const prev = readDraft(py, pm) || await Store.get('sched_' + ymKey(py, pm));
  S.prevTail = {};
  if (prev && prev.cells) Object.keys(prev.cells).forEach(id => { S.prevTail[id] = prev.cells[id].slice(-7); });
  S.undo = []; S.focus = null;
  check();
}
function mkCtx(group, rules) {
  const locks = {};
  Object.keys(S.month.locks || {}).forEach(id => {
    locks[id] = {};
    Object.keys(S.month.locks[id]).forEach(d => { const c = (S.month.cells[id] || [])[d]; if (c) locks[id][d] = c; });
  });
  return E.buildContext({ year: S.y, month: S.m, staff: activeStaff(group), shifts: S.cfg.shifts, groups: S.cfg.groups, rules: rules || S.cfg.rules, kindRules: S.cfg.rules,
    requests: S.requests, locks, prevTail: effectiveTail(), holidays: S.cfg.holidays });
}

// ── 分數明細：每條規則各扣了多少 ─────────────────────────
// 作法：把某條規則暫時關掉重算一次，總分少掉的部分就是它扣的分。
function scoreBreakdown() {
  const total = S.result.exact;
  const rows = [];
  let sum = 0;
  S.cfg.rules.filter(r => r.enabled && E.RULE_TYPES[r.type]).forEach(r => {
    const without = S.cfg.rules.map(x => (x === r ? Object.assign({}, x, { enabled: false }) : x));
    const cost = total - E.validate(mkCtx(null, without), S.month.cells).exact;
    sum += cost;
    if (cost <= 0.05) return;
    const hard = r.hard && !E.RULE_TYPES[r.type].softOnly;
    if (r.type === 'offQuota') {
      // 少休照規則本身扣，多休另外用「多休一天的扣分」算，分兩列顯示
      const unit = hard ? E.HARD : +r.weight || 0, extraW = Math.max(0, +(r.params || {}).extraWeight || 0);
      let extra = 0, less = 0;
      Object.values(S.result.stats).forEach((st, i) => { if (S.ctx.staff[i].counted && S.result.quota != null) { extra += Math.max(0, st.off - S.result.quota); less += Math.max(0, S.result.quota - st.off); } });
      if (less && unit) rows.push({ id: r.id, name: r.name + '：少休', hard, weight: r.weight, cost: less * unit, note: `少休 ${less} 天` });
      if (extra && extraW) rows.push({ id: r.id, name: r.name + '：多休', hard: false, weight: extraW, cost: extra * extraW, note: `多休 ${extra} 天` });
      return;
    }
    rows.push({ id: r.id, name: r.name, hard, weight: r.weight, cost, fair: /^fair/.test(r.type), kinds: r.type === 'maxKinds' });
  });
  if (total - sum > 0.05) rows.push({ name: '基本檢查（空白格、排到不能上的班別或停用的班別）', hard: true, cost: total - sum });
  rows.sort((a, b) => b.cost - a.cost);
  return { total, rows };
}
const fmtScore = v => (Math.abs(v - Math.round(v)) < 0.05 ? String(Math.round(v)) : v.toFixed(1));
function scoreCard() {
  const { total, rows } = scoreBreakdown();
  const num = 'style="text-align:right;font-variant-numeric:tabular-nums"';
  const line = x => {
    const w = x.hard ? E.HARD : +x.weight || 0, units = w ? x.cost / w : 0;
    const what = x.note || (x.kinds ? '超出種類上限的班數（每人最常上的幾種不算）' : x.fair ? '每人與平均的差，平方後加總' : x.hard ? '違反次數' : '發生次數');
    return `<tr><td>${esc(x.name)}</td><td>${x.hard ? '<span class="chip bad">一定要</span>' : '<span class="chip warn">盡量</span>'}</td>
      <td ${num}>${fmtScore(w)}</td><td ${num}>× ${fmtScore(units)}</td><td ${num}>＝ <b>${fmtScore(x.cost)}</b></td><td class="mute small">${esc(what)}</td></tr>`;
  };
  return `<details class="card score" id="scoreCard" open><summary><b>分數計算</b>　全機構總分 <b>${fmtScore(total)}</b> 分<span class="mute small">　越低越好；自動排班就是在找總分最低的排法</span></summary>
    ${rows.length ? `<div style="overflow-x:auto"><table class="list" style="margin-top:8px"><thead><tr><th>規則</th><th>類型</th><th style="text-align:right">每次扣分</th><th style="text-align:right">次數</th><th style="text-align:right">扣分</th><th>次數怎麼來的</th></tr></thead><tbody>
      ${rows.map(line).join('')}
      <tr><td colspan="4" style="text-align:right;font-weight:700;border:0">總分</td><td style="text-align:right;font-variant-numeric:tabular-nums;border:0"><b>${fmtScore(total)}</b></td><td style="border:0"></td></tr>
    </tbody></table></div><div class="mute small" style="margin-top:6px">每一列是「每次扣分 × 次數」，全部加起來就是總分。完整算法在「規則」頁最上面的「扣分怎麼算」。</div>` : '<div class="mute small" style="margin-top:8px">沒有任何扣分。</div>'}</details>`;
}

// ── 上月連班 ─────────────────────────────────────────────
// 預設從上個月的班表自動帶（S.prevTail）；主管可在「上月連班」視窗逐人改，
// 手動改過的存在本月班表的 prev 裡：{ 人員id: { days: 連上天數, code: 最後班別 } }
const isWorkCode = c => { const sh = shiftOf(c); return !!(sh && sh.kind === 'work'); };
function autoPrev(id) {
  const tail = S.prevTail[id] || [];
  let days = 0;
  for (let i = tail.length - 1; i >= 0 && isWorkCode(tail[i]); i--) days++;
  return { days, code: days ? tail[tail.length - 1] : '' };
}
function effectiveTail() {
  const out = Object.assign({}, S.prevTail), manual = S.month.prev || {};
  Object.keys(manual).forEach(id => {
    const m = manual[id];
    out[id] = m.days > 0 && isWorkCode(m.code) ? new Array(Math.min(7, m.days)).fill(m.code) : ['OF'];
  });
  return out;
}
function openPrev() {
  const py = S.m === 1 ? S.y - 1 : S.y, pm = S.m === 1 ? 12 : S.m - 1;
  const hasAuto = Object.keys(S.prevTail).length > 0;
  const rows = S.cfg.groups.map(g => {
    const people = activeStaff(g.id).filter(p => p.counted !== false);
    if (!people.length) return '';
    const codes = workShifts(g.id).filter(x => x.group === g.id && x.enabled !== false).map(x => x.code);
    return `<tr class="grp"><td colspan="3">${esc(g.name)}</td></tr>` + people.map(p => `<tr data-prev="${esc(p.id)}">
      <td>${esc(p.name)}</td>

      <td><select class="pc"><option value="">休假</option>${codes.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></td></tr>`).join('');
  }).join('');
  $('#modal').innerHTML = `<div class="modal-box">
    <h3>上月連班設定（${py - 1911} 年 ${pm} 月底）</h3>
    <div class="mute small" style="margin-bottom:10px">填每個人到上月最後一天為止已經連續上班幾天、最後一天上什麼班。${S.m} 月排班會接著算連班上限與輪班間隔。${hasAuto ? `目前的數字是從系統裡 ${pm} 月班表帶出來的，可以直接改。` : `系統裡沒有 ${pm} 月班表，請手動填；沒填的視為上月底休假。`}</div>
    <table class="list"><thead><tr><th>姓名</th><th>已連上</th><th>上月最後一天</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="bar" style="margin:14px 0 0">${hasAuto ? `<button class="btn" data-act="prevAuto">全部改回 ${pm} 月班表的數字</button>` : ''}<div class="sp"></div>
      <button class="btn" data-act="prevClose">取消</button><button class="btn primary" data-act="prevSave">套用</button></div></div>`;
  fillPrev(false);
  $('#modal').classList.add('show');
}
function fillPrev(autoOnly) {
  document.querySelectorAll('#modal tr[data-prev]').forEach(tr => {
    const id = tr.dataset.prev, v = (!autoOnly && (S.month.prev || {})[id]) || autoPrev(id);
    tr.querySelector('.pd').value = v.days || 0;
    tr.querySelector('.pc').value = v.days > 0 ? v.code : '';
  });
}
function savePrev() {
  const prev = {};
  let bad = '';
  document.querySelectorAll('#modal tr[data-prev]').forEach(tr => {
    const id = tr.dataset.prev, code = tr.querySelector('.pc').value;
    let days = Math.max(0, Math.min(7, Math.round(+tr.querySelector('.pd').value || 0)));
    if (days > 0 && !code) bad = bad || staffById(id).name + '：有連上天數，請選最後一天的班別';
    if (!code) days = 0;
    if (code && days === 0) days = 1;
    const a = autoPrev(id);
    if (days !== a.days || (days > 0 && code !== a.code)) prev[id] = { days, code: days ? code : '' };   // 只記和自動帶入不同的
  });
  if (bad) return toast(bad, true);
  S.month.prev = prev;
  $('#modal').classList.remove('show');
  markDirty(); check(); render();
  toast(Object.keys(prev).length ? `已套用，${Object.keys(prev).length} 位是手動設定。記得存檔` : '已套用，全部沿用上月班表');
}
function check() { S.ctx = mkCtx(); S.result = E.validate(S.ctx, S.month.cells); }
// 班表的修改先留在這台裝置當草稿，按「存檔」才寫進資料庫。
// 草稿存在瀏覽器，重新整理或換月份都不會不見；存檔或放棄修改後清掉。
const draftKey = (y, m) => 'nhsdraft:' + ymKey(y, m);
function readDraft(y, m) { try { return JSON.parse(localStorage.getItem(draftKey(y, m)) || 'null'); } catch (e) { return null; } }
function clearDraft() { try { localStorage.removeItem(draftKey(S.y, S.m)); } catch (e) {} S.dirty = false; }
function markDirty() {
  S.dirty = true;
  try { localStorage.setItem(draftKey(S.y, S.m), JSON.stringify({ cells: S.month.cells, locks: S.month.locks || {}, prev: S.month.prev || {} })); } catch (e) {}
}

function leaveState(y, m) {
  const day = S.cfg.leave.lockDay || 10;
  const py = m === 1 ? y - 1 : y, pm = m === 1 ? 12 : m - 1;
  const deadline = new Date(py, pm - 1, day, 23, 59, 59);
  const manual = S.lock && typeof S.lock.locked === 'boolean' ? S.lock.locked : null;
  const byDate = Date.now() > deadline.getTime();
  return { locked: manual == null ? byDate : manual, manual, byDate, text: `${pm} 月 ${day} 日` };
}

let toastTimer;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = ''; }, err ? 4200 : 2200);
}
function busy(msg) { $('#busyText').textContent = msg || '處理中…'; $('#busy').classList.toggle('show', !!msg); }
async function sha(text) {
  if (crypto && crypto.subtle) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('nhs|' + text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 5381; for (const ch of 'nhs|' + text) h = (h * 33) ^ ch.charCodeAt(0);
  return 'x' + (h >>> 0).toString(16);
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type || 'application/json' }));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function gridHtml({ edit, cells, mine }) {
  const ctx = S.ctx, n = ctx.dim, src = cells || S.month.cells;

      if (edit) {

// ── 規則有沒有生效 ───────────────────────────────────────
// 規則的名稱只是給人看的標籤，系統照「類型＋設定值」執行。這裡檢查設定是否完整到能生效。
const ONE_ONLY = ['minRest', 'offQuota', 'leaveOff', 'preferShift', 'fewChanges', 'isolatedWork'];
function ruleProblem(r) {
  const t = E.RULE_TYPES[r.type], p = r.params || {}, has = v => v != null && v !== '';
  if (!t) return '系統不認得這個規則類型';
  const need = [];
  t.fields.forEach(f => {
    if (f.optional || f.t === 'bool' || f.t === 'dayType' || f.t === 'group' || f.t === 'select') return;
    const v = p[f.k];
    if (f.t === 'codes' || f.t === 'weekdays' ? !(v || []).length : !has(v)) need.push(f.label);
  });
  if (need.length) return `還沒設定：${need.join('、')}`;
  if (t.fields.some(f => f.k === 'min') && t.fields.some(f => f.k === 'max') && !has(p.min) && !has(p.max)) return '「最少」和「最多」都沒填，等於沒有限制';
  if (p.staff && !staffById(p.staff)) return '指定的人員已不在名單上';
  const gone = [].concat(p.codes || [], p.code || []).filter(c => { const sh = shiftOf(c); return !sh || sh.enabled === false; });
  if (gone.length) return `班別 ${gone.join('、')} 已停用或不存在`;
  if (ONE_ONLY.includes(r.type) && S.cfg.rules.find(x => x.enabled && x.type === r.type) !== r) return '同類型的規則只有排在最前面的那條有效，這條不會被用到';
  if (r.type === 'maxKinds') {
    const groups = S.cfg.groups.filter(g => !p.group || p.group === 'all' || p.group === g.id);
    if (groups.every(g => workShifts(g.id).filter(x => x.group === g.id && x.enabled !== false).length <= +p.max)) return `適用的組別本來就只有 ${p.max} 種以下的班別，這條不會有任何影響`;
  }
  if (!(r.hard && !t.softOnly) && !(+r.weight > 0)) return '扣分是 0，等於不管這條';
  return '';
}
function ruleStatus(r, costs) {
  if (!r.enabled) return '';
  const bad = ruleProblem(r);
  if (bad) return `<div class="rstat bad">⚠ 這條目前不會生效：${esc(bad)}</div>`;
  if (!costs) return `<div class="rstat">設定完整，會生效。${S.m} 月還沒排班，排了之後這裡會顯示它扣了多少分。</div>`;
  const cost = costs[r.id] || 0, n = S.result.violations.filter(v => v.rule === r.id).length;
  return cost > 0.05
    ? `<div class="rstat warn">設定完整，會生效。${S.m} 月班表目前因為這條扣 <b>${fmtScore(cost)}</b> 分${n ? `（${n} 處）` : ''}</div>`
    : `<div class="rstat ok">設定完整，會生效。${S.m} 月班表目前沒有違反這條</div>`;
}

function rulesPage() {

        ${hard ? '' : `<label class="small mute">扣分 <input type="number" value="${esc(r.weight)}" data-chg="ruleWeight" data-r="${esc(r.id)}" style="width:64px"></label>`}
        <button class="btn sm danger" data-act="ruleDel" data-r="${esc(r.id)}">刪除</button></div></div>`;
  };
  const shiftRow = s => `<tr><td><b style="background:${s.bg};color:${s.color};border-radius:6px;padding:2px 9px">${esc(s.code)}</b></td>
    <td><input type="text" value="${esc(s.name)}" data-chg="shiftSet" data-c="${esc(s.code)}" data-k="name" style="width:110px"></td>
    <td>${s.kind === 'work' ? `<select data-chg="shiftSet" data-c="${esc(s.code)}" data-k="group">${S.cfg.groups.map(g => `<option value="${g.id}" ${s.group === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>` : '<span class="mute">休假</span>'}</td>
    <td>${s.kind === 'work' ? `<input type="number" value="${esc(s.start)}" data-chg="shiftSet" data-c="${esc(s.code)}" data-k="start" data-num="1"> ～ <input type="number" value="${esc(s.end)}" data-chg="shiftSet" data-c="${esc(s.code)}" data-k="end" data-num="1">` : ''}</td>

    <td>${s.custom ? `<button class="btn sm danger" data-act="shiftDel" data-c="${esc(s.code)}">刪除</button>` : ''}</td></tr>`;
  const addable = Object.keys(T).filter(k => T[k].custom);
  const explain = `<details class="card explain" open><summary><b>扣分怎麼算</b><span class="mute small">　自動排班會試很多種排法，每一種都照下面的方式算出總分，最後留下總分最低的那一份</span></summary>
    <p><b>總分 ＝ 所有規則的扣分加總，越低越好，0 分代表完全沒有違反任何規則。</b></p>
    <table class="list"><thead><tr><th style="width:120px">規則類型</th><th>扣分方式</th><th style="width:38%">例子</th></tr></thead><tbody>
      <tr><td><span class="chip bad">一定要</span></td><td>每違反一次扣 <code>${E.HARD}</code> 分，固定值，不能調。只要還有這類扣分，班表上方就會顯示「必須修正」。</td><td class="mute">某天小夜少 1 人 → 扣 ${E.HARD}。少 2 人 → 扣 ${E.HARD * 2}。</td></tr>
      <tr><td><span class="chip warn">盡量</span></td><td>每違反一次扣「該規則的扣分數」，就是每條規則右邊可以改的那個數字。</td><td class="mute">「減少換班」扣分設 3，全月沒休假就換班 10 次 → 扣 30。</td></tr>

      <tr><td>每月休假天數</td><td>少休一天：照「一定要／盡量」扣。<br>多休一天：扣「多休一天的扣分」，預設很低，因為人力有餘時多休是正常的。</td><td class="mute">應休 11 天只排 10 天 → 扣 ${E.HARD}。排了 13 天、多休扣分 5 → 扣 10。</td></tr>
    </tbody></table>
    <p><b>「一次」怎麼算：</b>人數類是差幾個人算幾次；連班上限是超過的每一天算一次（上限 6 天卻連 8 天 → 2 次）；輪班間隔、預假被排班、換班、只上一天班，每發生一次算一次；主要班別是每排到一個非主要班別算一次；班別種類上限是超出的那幾種班別、每上一班算一次（上限 2 種、某人上了 D 10、E 8、N 2 → 2 次）。</p>
    <p><b>扣分數怎麼調：</b>數字只有相對大小有意義。想讓系統更重視某件事，就把它的扣分調得比其他高。「一定要」固定 ${E.HARD} 分，遠高於任何「盡量」的規則，所以系統一定先滿足「一定要」，剩下的空間才用來減少「盡量」的扣分。把扣分設成 0 等於不管這條。</p>
    <p><b>同樣條件每次排出來都一樣：</b>系統用固定的亂數從 3 個不同起點各試數十萬次小調整（改一格、或同一天兩人對調），分數變低就保留。按「換一份」會換一組亂數，可能找到分數相近但長相不同的班表。實際每條規則扣了多少，在班表頁最下面的「分數計算」，班表上方的「總分」可以直接跳過去。</p></details>`;
  return `${explain}<div class="card"><h3>班別</h3>

      <div class="bar" style="margin:10px 0 0"><input type="text" id="newShift" placeholder="新班別代碼，例如 D12" style="width:190px"><button class="btn" data-act="shiftAdd">新增班別</button>
        <span class="mute small">時間以掛班當天 0 點起算：跨到隔天早上 8 點寫 32。系統用這個算輪班間隔。</span></div></div>
    <div class="card"><div class="bar" style="margin-bottom:0"><h3 style="margin:0">排班規則</h3><div class="sp"></div>
        <select id="newRuleType">${addable.map(k => `<option value="${k}">${esc(T[k].name)}</option>`).join('')}</select>
        <button class="btn" data-act="ruleAdd">新增規則</button><button class="btn" data-act="ruleReset">還原預設</button></div>
      <div class="mute small" style="margin:6px 0 4px">「一定要」的規則違反就算排不成；「盡量」的規則違反一次扣一次分，分數越高越優先遵守。改完立即生效，回班表頁重排即可。<br>
        <b>規則名稱只是標籤，系統照「類型」和下面的設定值執行。</b>每條規則下方會顯示它有沒有生效；想要的規則如果現有類型表達不了，名稱寫得再清楚也不會有作用，需要另外新增類型。</div>
      ${S.cfg.rules.some(r => r.enabled && ruleProblem(r)) ? `<div class="notice closed" style="margin:8px 0">有 ${S.cfg.rules.filter(r => r.enabled && ruleProblem(r)).length} 條規則目前不會生效，請看下方紅字。</div>` : ''}
      ${S.cfg.rules.map(rule).join('')}</div>`;
}

    </div></div>
    <div class="card"><h3>管理密碼</h3><div class="bar" style="margin:0"><input type="password" id="newPwd" placeholder="新密碼（至少 4 碼）"><button class="btn" data-act="pwd">變更</button></div></div>
    <div class="card"><h3>資料</h3>

      <div class="bar" style="margin:0"><button class="btn" data-act="backup">匯出備份</button><button class="btn" data-act="restore">匯入備份</button></div></div>`;

const ruleById = id => S.cfg.rules.find(r => r.id === id);
const staffById = id => S.staff.find(s => s.id === id);
function afterRules() { saveCfg(); check(); render(); }

const ACT = {
  async login() {
    const s = staffById($('#loginName').value);
    if (!s) return toast('請選擇姓名', true);
    S.user = { id: s.id, name: s.name }; S.tab = 'leave'; S.group = s.group;
    sessionStorage.setItem('nhs_user', JSON.stringify(S.user));
    const d = new Date(); d.setMonth(d.getMonth() + 1, 1); S.y = d.getFullYear(); S.m = d.getMonth() + 1;
    await loadMonth(); render();
  },
  async adminLogin() {
    const pwd = $('#adminPwd').value;
    if (!S.cfg.adminHash) {
      if (pwd.length < 4) return toast('密碼至少 4 碼', true);
      S.cfg.adminHash = await sha(pwd); await saveCfg();
    } else if (await sha(pwd) !== S.cfg.adminHash) return toast('密碼不對', true);
    S.user = { admin: true }; S.tab = 'sched'; S.group = 'all';
    sessionStorage.setItem('nhs_user', JSON.stringify(S.user));
    render();
  },
  logout() { S.user = null; sessionStorage.removeItem('nhs_user'); render(); },
  tab(el) { S.tab = el.dataset.tab; S.leaveMode = false; check(); render(); },
  group(el) { S.group = el.dataset.g; render(); },
  async month(el) {
    const d = new Date(S.y, S.m - 1 + (+el.dataset.d), 1);
    S.y = d.getFullYear(); S.m = d.getMonth() + 1;
    await loadMonth(); render();
  },
  leaveMode() { S.leaveMode = !S.leaveMode; render(); if (S.leaveMode) toast('點格子登記或取消預假；再按一次「預假登記」結束'); },
  async lockToggle() {
    const st = leaveState(S.y, S.m);
    S.lock = { locked: !st.locked, at: new Date().toISOString() };
    await Store.set('lock_' + ymKey(S.y, S.m), S.lock); render();
  },
  focus(el) {
    if (!el.dataset.s || el.dataset.d === '') return;
    S.focus = el.dataset.s + '_' + el.dataset.d;
    const p = staffById(el.dataset.s);
    if (p && S.group !== 'all' && S.group !== p.group) S.group = p.group;
    render();
    const td = document.querySelector(`td[data-s="${CSS.escape(el.dataset.s)}"][data-d="${el.dataset.d}"]`);
    if (td) td.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
  },
  async cell(el) {
    const id = el.dataset.s, d = +el.dataset.d;
    if (S.leaveMode) {
      const set = new Set(S.requests[id] || []);
      set.has(d) ? set.delete(d) : set.add(d);
      S.requests[id] = [...set].sort((a, b) => a - b);
      await Store.set(`req_${ymKey(S.y, S.m)}_${id}`, { days: S.requests[id], at: new Date().toISOString() });
      check(); render(); return;
    }
    openPop(el, id, d);
  },
  pick(el) {
    const { s: id, d, c } = el.dataset;
    pushUndo();
    const row = S.month.cells[id] || (S.month.cells[id] = new Array(dim()).fill(''));
    while (row.length < dim()) row.push('');
    row[+d] = c;
    const lock = $('#popLock').checked;
    S.month.locks = S.month.locks || {};
    if (lock && c) (S.month.locks[id] = S.month.locks[id] || {})[d] = true;
    else if (S.month.locks[id]) delete S.month.locks[id][d];
    S.focus = null; markDirty(); check(); render();
  },
  popClose() { closePop(); },
  undo() {
    const last = S.undo.pop(); if (!last) return;
    const o = JSON.parse(last); S.month.cells = o.cells; S.month.locks = o.locks;
    markDirty(); check(); render();
  },
  clear() {
    if (!confirm(`清空 ${S.m} 月${S.group === 'all' ? '' : groupName(S.group)}班表？鎖定的格子會保留。`)) return;
    pushUndo();
    activeStaff(S.group).forEach(p => {
      const lk = (S.month.locks || {})[p.id] || {};
      S.month.cells[p.id] = (S.month.cells[p.id] || new Array(dim()).fill('')).map((c, d) => (lk[d] ? c : ''));
    });
    markDirty(); check(); render();
  },
  async solve(el) {
    if (el.dataset.alt) S.seed++;
    pushUndo();
    const groups = S.cfg.groups.filter(g => (S.group === 'all' || g.id === S.group) && activeStaff(g.id).length);
    for (const g of groups) {
      busy(`正在排${g.name}…`); await tick();
      const ctx = mkCtx(g.id);
      const out = E.solve(ctx, { seed: S.seed });
      Object.assign(S.month.cells, out.cells);
    }
    busy(''); markDirty(); check(); render();
    toast(S.result.hard.length ? `排好了，但還有 ${S.result.hard.length} 項必須修正，請看下方清單` : '排好了，沒有違規');
  },
  async publish() {
    if (S.result.hard.length && !confirm(`還有 ${S.result.hard.length} 項必須修正，仍要發布嗎？`)) return;
    S.month.published = { cells: clone(S.month.cells), at: new Date().toISOString() };
    await saveMonth(); render(); toast('已存檔並發布，同仁現在看得到');
  },
  async save() { await saveMonth(); render(); toast(Store.mode === 'cloud' ? '已存檔到雲端' : '已存檔（存在這台裝置）'); },
  async discard() {
    if (!confirm('放棄未存檔的修改，回到上次存檔的內容？')) return;
    clearDraft(); await loadMonth(); render();
  },
  toScore() { const el = $('#scoreCard'); if (el) { el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } },
  prevOpen() { openPrev(); },
  prevAuto() { fillPrev(true); },
  prevSave() { savePrev(); },
  prevClose() { $('#modal').classList.remove('show'); },
  export() { exportExcel(); },

  // 同仁預假
  async myLeave(el) {
    if (leaveState(S.y, S.m).locked) return toast('預假已截止，要補登請找主管', true);
    const d = +el.dataset.d, set = new Set(S.requests[S.user.id] || []), max = +S.cfg.leave.max || 0;
    if (set.has(d)) set.delete(d);
    else { if (max && set.size >= max) return toast(`每人每月最多 ${max} 天`, true); set.add(d); }
    S.requests[S.user.id] = [...set].sort((a, b) => a - b);
    await Store.set(`req_${ymKey(S.y, S.m)}_${S.user.id}`, { days: S.requests[S.user.id], at: new Date().toISOString() });
    render();
  },

  // 人員
  staffAdd(el) {
    const g = el.dataset.g, names = $('#add_' + g).value.split(/[\s,，、]+/).map(x => x.trim()).filter(Boolean);
    if (!names.length) return toast('請輸入姓名', true);
    const dup = names.filter(nm => S.staff.some(s => s.name === nm));
    if (dup.length) return toast(`已經有同名的人：${dup.join('、')}`, true);
    names.forEach(nm => S.staff.push({ id: uid(g[0]), name: nm, group: g }));
    saveStaff(); check(); render(); toast(`已新增 ${names.length} 位`);
  },
  staffDel(el) {
    const s = staffById(el.dataset.s);
    if (!confirm(`刪除「${s.name}」？過去班表上他的資料會一併看不到。離職建議改用「在職」開關。`)) return;
    S.staff = S.staff.filter(x => x.id !== s.id); saveStaff(); check(); render();
  },
  staffMove(el) {
    const i = S.staff.findIndex(x => x.id === el.dataset.s), dir = +el.dataset.d;
    let j = i + dir;
    while (S.staff[j] && S.staff[j].group !== S.staff[i].group) j += dir;
    if (!S.staff[j]) return;
    [S.staff[i], S.staff[j]] = [S.staff[j], S.staff[i]]; saveStaff(); render();
  },
  staffFlag(el) {
    const s = staffById(el.dataset.s), k = el.dataset.k;
    s[k] = s[k] === false; saveStaff(); check(); render();
  },
  staffCode(el) {
    const s = staffById(el.dataset.s), k = el.dataset.k, c = el.dataset.c;
    const all = workShifts(s.group).filter(x => x.group === s.group).map(x => x.code);
    let list = k === 'allowed' ? (s.allowed && s.allowed.length ? s.allowed.slice() : all.slice()) : (s.prefer || []).slice();
    list = list.includes(c) ? list.filter(x => x !== c) : list.concat(c);
    if (k === 'allowed' && !list.length) return toast('至少要留一個可上的班別', true);
    s[k] = all.filter(x => list.includes(x));
    if (k === 'allowed') s.prefer = (s.prefer || []).filter(x => s.allowed.includes(x));
    saveStaff(); check(); render();
  },

  // 規則與班別
  ruleToggle(el) { const r = ruleById(el.dataset.r); r.enabled = !r.enabled; afterRules(); },
  ruleHard(el) { ruleById(el.dataset.r).hard = el.dataset.v === '1'; afterRules(); },
  ruleDel(el) { const r = ruleById(el.dataset.r); if (!confirm(`刪除規則「${r.name}」？`)) return; S.cfg.rules = S.cfg.rules.filter(x => x !== r); afterRules(); },
  rulePick(el) {
    const r = ruleById(el.dataset.r), k = el.dataset.k, v = el.dataset.num ? +el.dataset.v : el.dataset.v;
    const list = (r.params[k] || []).slice();
    r.params[k] = list.includes(v) ? list.filter(x => x !== v) : list.concat(v);
    afterRules();
  },
  ruleAdd() {
    const type = $('#newRuleType').value, t = E.RULE_TYPES[type];
    const params = {};
    t.fields.forEach(f => { params[f.k] = f.t === 'codes' || f.t === 'weekdays' ? [] : f.t === 'num' ? (f.optional ? null : 1) : f.t === 'bool' ? false : f.t === 'dayType' || f.t === 'group' ? 'all' : ''; });
    S.cfg.rules.push({ id: uid('r'), type, name: '新規則：' + t.name, enabled: true, hard: !t.softOnly, weight: 20, params });
    afterRules(); toast('已新增在最下面，請設定內容');
    window.scrollTo(0, document.body.scrollHeight);
  },
  ruleReset() {
    if (!confirm('把規則還原成預設值？自己新增的規則會消失。')) return;
    S.cfg.rules = clone(E.DEFAULT_RULES).concat(SEED ? clone(SEED.rules || []) : []); afterRules();
  },
  shiftToggle(el) { const s = shiftOf(el.dataset.c); s.enabled = s.enabled === false; afterRules(); },
  shiftAdd() {
    const code = $('#newShift').value.trim();
    if (!code) return toast('請輸入代碼', true);
    if (shiftOf(code)) return toast('這個代碼已經有了', true);
    S.cfg.shifts.splice(S.cfg.shifts.findIndex(s => s.kind === 'off'), 0, { code, name: code, kind: 'work', group: S.cfg.groups[0].id, start: 8, end: 16, color: '#334155', bg: '#e2e8f0', enabled: true, custom: true });
    afterRules();
  },
  shiftDel(el) {
    const code = el.dataset.c;
    if (!confirm(`刪除班別 ${code}？`)) return;
    S.cfg.shifts = S.cfg.shifts.filter(s => s.code !== code);
    S.staff.forEach(s => { if (s.allowed) s.allowed = s.allowed.filter(c => c !== code); if (s.prefer) s.prefer = s.prefer.filter(c => c !== code); });
    saveStaff(); afterRules();
  },

  // 設定
  async pwd() {
    const v = $('#newPwd').value;
    if (v.length < 4) return toast('密碼至少 4 碼', true);
    S.cfg.adminHash = await sha(v); await saveCfg(); $('#newPwd').value = ''; toast('密碼已變更');
  },
  async backup() {
    const data = await Store.list('');
    download(`排班備份_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(data, null, 1));
  },
  restore() { $('#fileIn').click(); },
};

const CHG = {
  staffName(el) {
    const s = staffById(el.dataset.s), v = el.value.trim();
    if (!v) { el.value = s.name; return; }
    s.name = v; saveStaff();
  },
  ruleName(el) { ruleById(el.dataset.r).name = el.value.trim() || '未命名規則'; saveCfg(); },
  ruleWeight(el) { ruleById(el.dataset.r).weight = Math.max(0, +el.value || 0); saveCfg(); check(); render(); },
  ruleNum(el) { ruleById(el.dataset.r).params[el.dataset.k] = el.value === '' ? null : +el.value; saveCfg(); check(); render(); },
  ruleBool(el) { ruleById(el.dataset.r).params[el.dataset.k] = el.checked; saveCfg(); check(); render(); },
  ruleSel(el) { ruleById(el.dataset.r).params[el.dataset.k] = el.value; saveCfg(); check(); render(); },
  shiftSet(el) { shiftOf(el.dataset.c)[el.dataset.k] = el.dataset.num ? +el.value : el.value; saveCfg(); check(); render(); },
  cfgSet(el) { S.cfg[el.dataset.k] = el.value.trim() || S.cfg[el.dataset.k]; saveCfg(); render(); },
  leaveSet(el) { S.cfg.leave[el.dataset.k] = Math.max(0, +el.value || 0); saveCfg(); },
  holidays(el) {
    const map = {};
    el.value.split('\n').forEach(line => {
      const m = line.trim().match(/^(-)?(\d{4}-\d{2}-\d{2})\s*(.*)$/);
      if (m) map[m[2]] = m[1] ? null : (m[3] || '假日');
    });
    S.cfg.holidays = map; saveCfg(); check(); render();
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el) { if (!el.disabled) Promise.resolve(ACT[el.dataset.act](el, e)).catch(err => { console.error(err); busy(''); toast('發生錯誤：' + err.message, true); }); return; }
  if (!e.target.closest('#pop')) closePop();
});
document.addEventListener('change', e => { const el = e.target.closest('[data-chg]'); if (el) CHG[el.dataset.chg](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePop(); $('#modal').classList.remove('show'); }

});
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data.config || !data.staff) throw new Error('這不是排班備份檔');
    if (!confirm('匯入會覆蓋目前所有資料，確定嗎？')) return;
    for (const k of Object.keys(data)) await Store.set(k, data[k]);
    await loadAll(); await loadMonth(); render(); toast('已匯入');
  } catch (err) { toast('匯入失敗：' + err.message, true); }
});

// ── 選班小視窗 ───────────────────────────────────────────
function openPop(td, id, d) {
  const p = staffById(id), cur = (S.month.cells[id] || [])[d] || '';
  const allowed = p.allowed && p.allowed.length ? p.allowed : workShifts(p.group).filter(s => s.group === p.group).map(s => s.code);
  const opts = workShifts(p.group).filter(s => s.enabled !== false).concat(offShifts());
  const locked = !!((S.month.locks || {})[id] || {})[d];
  const pop = $('#pop');
  pop.innerHTML = `<div class="ttl">${esc(p.name)}　${S.m}/${d + 1}（${E.WD[S.ctx.days[d].wd]}）${(S.requests[id] || []).includes(d) ? '<span class="chip bad" style="margin-left:4px">預假</span>' : ''}</div>
    <div class="opts">${opts.map(s => `<div class="o ${s.code === cur ? 'cur' : ''} ${s.kind === 'work' && !allowed.includes(s.code) ? 'dim' : ''}" style="background:${s.bg};color:${s.color}" title="${esc(s.name)}" data-act="pick" data-s="${esc(id)}" data-d="${d}" data-c="${esc(s.code)}">${esc(s.code)}</div>`).join('')}</div>
    <label><input type="checkbox" id="popLock" ${locked ? 'checked' : ''}> 鎖定這格（自動排班不會動它）</label>
    <div class="foot"><button class="btn sm" data-act="pick" data-s="${esc(id)}" data-d="${d}" data-c="">清空</button><button class="btn sm" data-act="popClose">關閉</button></div>`;
  pop.style.display = 'block';
  const r = td.getBoundingClientRect(), w = 232, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left)) + 'px';
  pop.style.top = (r.bottom + h + 8 > window.innerHeight ? Math.max(8, r.top - h - 4) : r.bottom + 4) + 'px';
}
function closePop() { $('#pop').style.display = 'none'; }

// ── 匯出 Excel（版面比照機構原本的班表）──────────────────
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = res; s.onerror = () => rej(new Error('載入 Excel 元件失敗'));
    document.head.appendChild(s);
  });
}
function sheetRows(g) {
  const ctx = S.ctx, n = ctx.dim, people = activeStaff(g.id), offs = offShifts().map(s => s.code);
  const codes = workShifts(g.id).filter(s => s.group === g.id).map(s => s.code);
  const rows = [['', `${S.y - 1911}年${S.m}月${S.cfg.facility}${g.name}班表　　休假日數：${S.result.quota == null ? '' : S.result.quota}日`],
    ['', '日期'].concat(ctx.days.map(x => x.d + 1), ['上班'], offs), ['', '星期'].concat(ctx.days.map(x => E.WD[x.wd]))];
  people.forEach((p, i) => {
    const row = (S.month.cells[p.id] || []).concat(new Array(n).fill('')).slice(0, n);
    rows.push([i + 1, p.name].concat(row, [row.filter(c => codes.includes(c)).length], offs.map(o => row.filter(c => c === o).length)));
  });
  rows.push([]);
  codes.forEach(c => rows.push(['', c].concat(ctx.days.map(x => people.filter(p => p.counted !== false && (S.month.cells[p.id] || [])[x.d] === c).length))));
  return rows;
}
async function exportExcel() {
  const groups = S.cfg.groups.filter(g => activeStaff(g.id).length);
  const name = `${S.y - 1911}.${S.m}班表`;
  try {
    await loadXlsx();
    const wb = XLSX.utils.book_new();
    groups.forEach(g => {
      const ws = XLSX.utils.aoa_to_sheet(sheetRows(g));
      ws['!cols'] = [{ wch: 4 }, { wch: 12 }].concat(S.ctx.days.map(() => ({ wch: 4 })));
      XLSX.utils.book_append_sheet(wb, ws, g.name.slice(0, 28));
    });
    XLSX.writeFile(wb, name + '.xlsx');
  } catch (e) {
    // 沒有網路時改出 CSV，Excel 一樣打得開
    const csv = groups.map(g => sheetRows(g).map(r => r.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(',')).join('\n')).join('\n\n');
    download(name + '.csv', '﻿' + csv, 'text/csv');
    toast('無法載入 Excel 元件，已改匯出 CSV');
  }
}

// ── 啟動 ─────────────────────────────────────────────────
(async function start() {
  await initStore();
  await loadAll();
  const d = new Date(); d.setMonth(d.getMonth() + 1, 1);
  S.y = d.getFullYear(); S.m = d.getMonth() + 1;
  try {
    const u = JSON.parse(sessionStorage.getItem('nhs_user') || 'null');
    if (u && (u.admin || staffById(u.id))) { S.user = u; S.tab = u.admin ? 'sched' : 'leave'; if (!u.admin) S.group = staffById(u.id).group; }
  } catch (e) {}
  await loadMonth();
  render();
})();
</script>
