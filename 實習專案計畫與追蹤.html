<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>進階長期照護實習二 · 專案計畫與追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDF0F3; --card:#FFFFFF;
    --ink:#14232F; --ink2:#4A5C6A; --ink3:#8195A3;
    --line:#D3DBE2; --hair:#EBF0F3;
    --teal:#0F766E; --teal-soft:#E1F0EE;
    --amber:#B45309; --amber-soft:#FAEEDA;
    --indigo:#3B5BA5; --rose:#9F1239;
    --rail:60px;
    --serif:"Noto Serif TC",Georgia,serif;
    --sans:"Noto Sans TC","Helvetica Neue",Arial,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px 96px}

  .bar{position:sticky;top:0;z-index:30;background:rgba(237,240,243,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar-in{max-width:980px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{font-family:var(--serif);font-weight:700;font-size:17px}
  .brand small{display:block;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink3);letter-spacing:.08em}
  .tabs{display:flex;gap:2px;background:#E2E7EC;border-radius:8px;padding:3px;margin-left:14px}
  .tabs button{border:0;background:transparent;color:var(--ink2);padding:5px 15px;border-radius:6px;font-size:13.5px;transition:.15s}
  .tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,35,47,.12);font-weight:500}
  .spacer{margin-left:auto}
  button{font-family:inherit;font-size:13px;cursor:pointer}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:7px 13px;border-radius:7px;transition:.15s}
  .btn:hover{border-color:var(--teal);color:var(--teal)}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.primary:hover{background:var(--teal);border-color:var(--teal);color:#fff}
  .saved{font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.06em;min-width:70px}
  .saved.on{color:var(--teal)}

  .hero{padding:36px 0 22px;display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
  h1{font-family:var(--serif);font-size:29px;line-height:1.35;margin:0 0 6px;font-weight:700}
  .sub{color:var(--ink2);font-size:13.5px;margin:0;max-width:44ch}
  .gauge{margin-left:auto;display:flex;align-items:center;gap:14px}
  .ring{position:relative;width:80px;height:80px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:17px;font-weight:600}
  .gauge-txt{font-size:12.5px;color:var(--ink2);line-height:1.65}
  .gauge-txt strong{display:block;font-family:var(--mono);font-size:13px;color:var(--ink)}

  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
  .meta label{background:var(--card);padding:9px 13px;display:block}
  .meta span{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink3)}
  .meta input{border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);width:100%;padding:1px 0}
  .meta input:focus{outline:0;color:var(--teal)}

  .sec-h{display:flex;align-items:baseline;gap:12px;margin:38px 0 18px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
  .sec-h h2{font-family:var(--serif);font-size:19px;margin:0;font-weight:700}
  .sec-h em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink3);letter-spacing:.08em;margin-left:auto}

  /* 甘特圖 */
  .gwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 4px 10px;overflow-x:auto}
  .gantt{min-width:760px}
  .grow{display:flex;align-items:center;border-bottom:1px solid var(--hair)}
  .grow:last-child{border-bottom:0}
  .ghead{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px;align-items:flex-end}
  .headcells{flex:1;min-width:0;display:grid}
  .gh{font-family:var(--mono);font-size:10.5px;color:var(--ink3);text-align:center;line-height:1.35;padding:0 2px;min-width:0}
  .gh b{display:block;font-size:11.5px;color:var(--ink2);font-weight:600}
  .gname{width:286px;flex:none;display:flex;align-items:center;gap:6px;padding:3px 8px 3px 12px;min-width:0}
  .dot{width:9px;height:9px;border-radius:2px;flex:none;border:0;padding:0;cursor:pointer}
  .gname input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink);padding:2px 0}
  .gname input:focus{outline:0;color:var(--teal)}
  .wsel{display:flex;align-items:center;gap:2px;flex:none}
  .wsel select{border:1px solid var(--hair);background:#FCFDFE;border-radius:5px;font-family:var(--mono);font-size:11px;
    color:var(--ink2);padding:1px 2px;cursor:pointer}
  .wsel select:focus{outline:0;border-color:var(--teal);color:var(--teal)}
  .wsel i{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .gx{border:0;background:transparent;color:transparent;font-size:12px;padding:2px 4px;border-radius:4px;flex:none}
  .grow:hover .gx{color:var(--ink3)}
  .gx:hover{background:#FDECEF;color:var(--rose)!important}
  .track{flex:1;min-width:0;position:relative;height:30px;touch-action:none;cursor:crosshair;user-select:none}
  .track .cellgrid{position:absolute;inset:0;display:grid}
  .track .cellgrid i{border-left:1px dashed #E4EAEF}
  .track .cellgrid i:first-child{border-left:0}
  .bar-t{position:absolute;top:7px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .bar-t span{font-family:var(--mono);font-size:9.5px;color:#fff;opacity:.9;letter-spacing:.04em;white-space:nowrap}
  .today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--rose);opacity:.55;pointer-events:none}
  .glegend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 12px 2px;font-size:12px;color:var(--ink3);align-items:center}
  .glegend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .ghint{padding:2px 12px 6px;font-size:12px;color:var(--ink3)}

  /* 階段 */
  .stage{position:relative;padding-left:var(--rail);padding-bottom:22px;scroll-margin-top:82px}
  .stage::before{content:"";position:absolute;left:19px;top:34px;bottom:-4px;width:2px;background:var(--line)}
  .stage:last-of-type::before{display:none}
  .node{position:absolute;left:0;top:6px;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);
    background:var(--card);display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink3);transition:.2s}
  .stage[data-s="doing"] .node{border-color:var(--amber);color:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
  .stage[data-s="done"] .node{border-color:var(--teal);background:var(--teal);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px 6px}
  .stage[data-s="doing"] .card{border-color:#E8C88E}
  .stage[data-s="done"] .card{background:#FBFDFD}
  .stage.flash .card{box-shadow:0 0 0 3px var(--teal-soft)}
  .row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .date-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;background:var(--paper)}
  .date-chip .roc{font-family:var(--mono);font-size:13.5px;font-weight:600;white-space:nowrap}
  .date-chip input{border:0;background:transparent;font-family:var(--mono);font-size:12px;color:var(--ink3);width:126px;padding:0}
  .date-chip input:focus{outline:0;color:var(--teal)}
  .theme{flex:1;min-width:150px;border:0;border-bottom:1px dashed var(--line);background:transparent;
    font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink);padding:2px 0}
  .theme:focus{outline:0;border-bottom-color:var(--teal)}
  .theme::placeholder{color:var(--ink3);font-weight:400}
  .field{border-top:1px solid var(--hair);padding:11px 0 3px}
  .field > span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink3);display:block;margin-bottom:3px}
  .stage[data-s="done"] .field > span{color:var(--teal)}
  textarea{width:100%;border:0;background:transparent;font:inherit;color:var(--ink);resize:none;overflow:hidden;padding:0;line-height:1.75}
  textarea:focus{outline:0}
  textarea::placeholder{color:#B8C5CE}
  .tools-line{border-top:1px solid var(--hair);padding:10px 0 4px;display:flex;align-items:center;gap:8px}
  .tools-line span{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink3);flex:none}
  .tools-line input{flex:1;border:0;background:transparent;font:inherit;font-size:13.5px;color:var(--ink2)}
  .tools-line input:focus{outline:0;color:var(--teal)}
  .out{border-top:1px solid var(--hair);margin-top:10px;padding-top:11px}
  .out > h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink3);margin:0 0 7px;font-weight:400}
  .item{border:1px solid var(--hair);border-radius:8px;margin-bottom:6px;background:#FCFDFE}
  .item-h{display:flex;align-items:flex-start;gap:9px;padding:8px 10px;cursor:pointer}
  .box{width:17px;height:17px;flex:none;border:1.5px solid var(--line);border-radius:4px;background:#fff;margin-top:3px;
    display:grid;place-items:center;color:transparent;font-size:11px;line-height:1;transition:.15s}
  .item.done .box{background:var(--teal);border-color:var(--teal);color:#fff}
  .item-t{flex:1;font-size:13.5px;line-height:1.55}
  .item-t b{font-family:var(--mono);font-size:11.5px;color:var(--ink3);font-weight:600;margin-right:6px}
  .item.done .item-t{color:var(--ink3);text-decoration:line-through;text-decoration-color:#BFD5D2}
  .item.done .item-t b{color:var(--teal)}
  .item-ask{display:block;font-size:12px;color:var(--ink3);text-decoration:none;margin-top:1px}
  .item-note{padding:0 10px 9px 36px}
  .item-note textarea{font-size:13.5px;border-left:2px solid var(--teal-soft);padding-left:9px}
  .item:not(.open) .item-note{display:none}

  /* 每週實際紀錄 */
  .diary{border-top:1px solid var(--hair);margin-top:10px;padding-top:11px}
  .diary > h4{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--indigo);margin:0 0 7px;font-weight:400}
  .entry{border-left:2px solid #DDE4F0;padding:2px 0 6px 11px;margin-bottom:7px}
  .entry-h{display:flex;align-items:center;gap:8px}
  .entry-h input[type=date]{border:0;background:transparent;font-family:var(--mono);font-size:12px;color:var(--ink2);padding:0;width:126px}
  .entry-h input[type=date]:focus{outline:0;color:var(--teal)}
  .entry-h .roc2{font-family:var(--mono);font-size:12px;color:var(--ink3)}
  .entry textarea{font-size:13.5px;margin-top:2px}
  .entry .nx{color:var(--amber)}
  .entry .nx::placeholder{color:#D9BE93}
  .mini{border:1px dashed var(--line);background:transparent;color:var(--ink3);border-radius:8px;padding:6px 12px;font-size:12.5px;transition:.15s}
  .mini:hover{border-color:var(--indigo);color:var(--indigo)}

  .tools{display:flex;align-items:center;gap:6px;padding:9px 0 11px;border-top:1px solid var(--hair);margin-top:9px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:transparent;color:var(--ink3);padding:3px 11px;border-radius:20px;font-size:12px;transition:.15s}
  .chip:hover{border-color:var(--ink2);color:var(--ink2)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .stage[data-s="doing"] .chip.on{background:var(--amber);border-color:var(--amber)}
  .stage[data-s="done"] .chip.on{background:var(--teal);border-color:var(--teal)}
  .icons{margin-left:auto;display:flex;gap:2px}
  .ico{border:0;background:transparent;color:var(--ink3);padding:4px 7px;border-radius:6px;font-size:13px;line-height:1}
  .ico:hover{background:var(--paper);color:var(--ink)}
  .ico.del:hover{background:#FDECEF;color:var(--rose)}
  .add{width:100%;margin-top:4px;border:1px dashed var(--line);background:transparent;color:var(--ink3);
    padding:13px;border-radius:12px;font-size:13.5px;transition:.15s}
  .add:hover{border-color:var(--teal);color:var(--teal);background:var(--card)}

  /* 追蹤頁 */
  .box-c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 17px}
  .box-c h3{font-family:var(--serif);font-size:15.5px;margin:0 0 3px;font-weight:600}
  .box-c .cap{font-size:12px;color:var(--ink3);margin:0 0 12px}
  .ind{border-top:1px solid var(--hair);padding:12px 0 10px}
  .ind:first-of-type{border-top:0;padding-top:2px}
  .ind-h{display:flex;align-items:center;gap:6px}
  .ind-h input.nm{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--ink);padding:0}
  .ind-h input.nm:focus{outline:0;color:var(--teal)}
  .ind-pct{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--teal)}
  .meter{height:7px;border-radius:4px;background:#E7EDF1;margin:8px 0 7px;position:relative;overflow:hidden}
  .meter i{position:absolute;left:0;top:0;bottom:0;background:var(--teal);border-radius:4px;transition:width .25s}
  .nums{display:flex;gap:6px;flex-wrap:wrap}
  .num{display:flex;align-items:center;gap:4px;border:1px solid var(--hair);border-radius:6px;padding:2px 7px;background:#FCFDFE}
  .num span{font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.06em}
  .num input{width:54px;border:0;background:transparent;font-family:var(--mono);font-size:13px;color:var(--ink);padding:0}
  .num input.u{width:40px;font-family:var(--sans);font-size:12.5px;color:var(--ink2)}
  .num input:focus{outline:0;color:var(--teal)}
  .skel-row{display:flex;gap:11px;align-items:baseline;padding:7px 0;border-top:1px solid var(--hair);cursor:pointer}
  .skel-row:hover .sk-name{color:var(--teal)}
  .sk-n{font-family:var(--mono);font-size:11.5px;color:var(--ink3);width:26px;flex:none;text-align:right}
  .sk-name{flex:1;font-size:14px}
  .sk-name em{font-style:normal;color:var(--ink3);font-size:12.5px}
  .sk-when{font-family:var(--mono);font-size:11.5px;color:var(--ink3);flex:none}
  .sk-row-done .sk-n,.sk-row-done .sk-name{color:var(--teal)}
  .warn{margin-top:14px;padding:11px 13px;background:var(--amber-soft);border-radius:8px;font-size:12.5px;color:#7A3E06;line-height:1.65}
  .warn b{font-weight:700}

  .foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .foot p{margin:0 auto 0 0;font-size:12px;color:var(--ink3)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--ink);color:#fff;
    padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .page{display:none}
  .page.on{display:block}

  /* 側欄 */
  .shell{display:flex;gap:26px;align-items:flex-start}
  .main{flex:1;min-width:0}
  .nav{width:198px;flex:none;position:sticky;top:86px;max-height:calc(100vh - 110px);overflow-y:auto;padding-bottom:8px}
  .nav h5{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink3);margin:0 0 8px 10px;font-weight:400}
  .nav h5.mt{margin-top:18px}
  .nlink{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;border:0;background:transparent;
    padding:6px 10px;border-radius:8px;color:var(--ink2);font-size:13px;line-height:1.45;transition:.14s}
  .nlink:hover{background:#E4E9EE;color:var(--ink)}
  .nlink.here{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(20,35,47,.1);font-weight:500}
  .nlink .nd{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px;border:1.5px solid var(--line);background:#fff}
  .nlink[data-s="doing"] .nd{border-color:var(--amber);background:var(--amber)}
  .nlink[data-s="done"] .nd{border-color:var(--teal);background:var(--teal)}
  .nlink .nt{flex:1;min-width:0}
  .nlink .nw{display:block;font-family:var(--mono);font-size:10px;color:var(--ink3);letter-spacing:.06em}
  .nlink.here .nw{color:var(--teal)}

  /* 小幫手 */
  .fab{position:fixed;right:22px;bottom:22px;z-index:45;width:50px;height:50px;border-radius:50%;border:0;
    background:var(--ink);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(20,35,47,.28);transition:.18s}
  .fab:hover{background:var(--teal);transform:translateY(-1px)}
  .fab-dot{position:absolute;top:5px;right:6px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--amber);
    color:#fff;font-family:var(--mono);font-size:10.5px;line-height:17px;display:none}
  .fab-dot.on{display:block}
  .helper{position:fixed;right:22px;bottom:82px;z-index:46;width:376px;max-width:calc(100vw - 44px);
    max-height:min(74vh,640px);background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 14px 40px rgba(20,35,47,.2);display:none;flex-direction:column;overflow:hidden}
  .helper.on{display:flex}
  .helper-h{display:flex;align-items:center;padding:12px 14px 10px;border-bottom:1px solid var(--hair)}
  .helper-h b{font-family:var(--serif);font-size:15px}
  .hx{margin-left:auto;border:0;background:transparent;color:var(--ink3);font-size:14px;padding:2px 6px;border-radius:6px}
  .hx:hover{background:var(--paper);color:var(--ink)}
  .helper-tabs{display:flex;gap:2px;padding:8px 12px 0}
  .helper-tabs button{flex:1;border:0;background:transparent;color:var(--ink3);padding:6px 4px 8px;font-size:12.5px;
    border-bottom:2px solid transparent;transition:.14s}
  .helper-tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:500}
  .helper-b{padding:12px 14px 14px;overflow-y:auto;flex:1}
  .helper-f{display:flex;gap:7px;align-items:flex-end;padding:10px 12px 12px;border-top:1px solid var(--hair)}
  .helper-f textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13.5px;max-height:110px;overflow-y:auto}
  .helper-f textarea:focus{border-color:var(--teal)}
  .helper-f .btn{flex:none;padding:7px 12px}

  .hnow{background:var(--paper);border-radius:9px;padding:10px 12px;margin-bottom:12px}
  .hnow .w{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink3)}
  .hnow .t{font-family:var(--serif);font-size:15.5px;font-weight:600;margin-top:1px}
  .hnow .d{font-size:12px;color:var(--ink2);margin-top:3px}
  .hsec{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink3);margin:14px 0 6px}
  .hsec:first-child{margin-top:0}
  .todo{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--hair);font-size:13.5px;line-height:1.5;cursor:pointer}
  .todo:hover{color:var(--teal)}
  .todo .k{font-family:var(--mono);font-size:11px;color:var(--ink3);flex:none;margin-top:2px}

const WD = ['日','一','二','三','四','五','六'];

async function load(){
  try{ if(window.storage){ const r = await window.storage.get(KEY); if(r && r.value) return JSON.parse(r.value); } }catch(e){}
  if(mem[KEY]) return JSON.parse(mem[KEY]);
  return null;
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const s = JSON.stringify(data);
    mem[KEY] = s;
    try{ if(window.storage) await window.storage.set(KEY, s); }catch(e){}
    const el = document.getElementById('saved');
    el.textContent = '已儲存 ✓'; el.classList.add('on');
    setTimeout(()=>{ el.classList.remove('on'); el.textContent=''; }, 1600);
  }, 400);
}
function roc(iso){
  if(!iso) return '日期未填';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return '日期未填';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()-1911}.${p(d.getMonth()+1)}.${p(d.getDate())}（${WD[d.getDay()]}）`;
}
function md(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  return isNaN(d) ? '—' : `${d.getMonth()+1}/${d.getDate()}`;
}
function grow(t){ t.style.height='auto'; t.style.height = t.scrollHeight+'px'; }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1900);
}

/* ── 甘特圖 ── */
function todayCol(){
  const t = new Date(); t.setHours(0,0,0,0);
  for(let i=0;i<data.stages.length;i++){
    const a = data.stages[i].date ? new Date(data.stages[i].date+'T00:00:00') : null;
    if(!a) continue;
    const nx = data.stages[i+1] && data.stages[i+1].date ? new Date(data.stages[i+1].date+'T00:00:00') : null;
    const end = nx || new Date(a.getTime()+7*86400000);
    if(t>=a && t<end) return i + (t-a)/(end-a);
  }
  return null;
}
function renderGantt(){
  const g = document.getElementById('gantt');
  const N = data.stages.length;
  g.innerHTML = '';
  if(!N){ g.textContent = '請先建立階段。'; return; }
  g.style.minWidth = Math.max(760, 286 + N*46) + 'px';

  const head = document.createElement('div');
  head.className = 'grow ghead';
  const hpad = document.createElement('div');
  hpad.className = 'gname';
  head.appendChild(hpad);
  const hcells = document.createElement('div');
  hcells.className = 'headcells';
  hcells.style.gridTemplateColumns = `repeat(${N},1fr)`;
  data.stages.forEach((s,i)=>{
    const c = document.createElement('div');
    c.className = 'gh';
    c.innerHTML = `<b>W${i+1}</b>${md(s.date)}`;
    hcells.appendChild(c);
  });
  head.appendChild(hcells);
  g.appendChild(head);

  const tc = todayCol();

  data.tasks.forEach((t,i)=>{
    if(t.s>t.e){ const k=t.s; t.s=t.e; t.e=k; }
    t.s = Math.max(0,Math.min(N-1,t.s));
    t.e = Math.max(t.s,Math.min(N-1,t.e));

    const row = document.createElement('div');
    row.className = 'grow';

    const nm = document.createElement('div');
    nm.className = 'gname';
    nm.innerHTML = `<button class="dot" title="換分類"></button><input>
      <span class="wsel"><select class="ss"></select><i>–</i><select class="ee"></select></span>
      <button class="gx" title="刪除">✕</button>`;
    const dot = nm.querySelector('.dot');
    dot.style.background = phase(t.p).color;
    dot.addEventListener('click', ()=>{
      const k = PHASES.findIndex(p=>p.id===t.p);
      data.tasks[i].p = PHASES[(k+1)%PHASES.length].id;
      save(); renderGantt();
    });
    const inp = nm.querySelector('input');
    inp.value = t.name; inp.placeholder = '工作名稱';
    inp.addEventListener('input', ()=>{ data.tasks[i].name = inp.value; save(); });
    const ss = nm.querySelector('.ss'), ee = nm.querySelector('.ee');
    for(let c=0;c<N;c++){
      ss.appendChild(new Option('W'+(c+1), c));
      ee.appendChild(new Option('W'+(c+1), c));
    }
    ss.value = t.s; ee.value = t.e;
    ss.addEventListener('change', ()=>{
      data.tasks[i].s = +ss.value;
      if(data.tasks[i].e < data.tasks[i].s) data.tasks[i].e = data.tasks[i].s;
      save(); renderGantt();
    });
    ee.addEventListener('change', ()=>{
      data.tasks[i].e = +ee.value;
      if(data.tasks[i].e < data.tasks[i].s) data.tasks[i].s = data.tasks[i].e;
      save(); renderGantt();
    });
    nm.querySelector('.gx').addEventListener('click', ()=>{
      if(confirm(`刪除「${t.name||'未命名'}」？`)){ data.tasks.splice(i,1); save(); renderGantt(); }
    });
    row.appendChild(nm);

    const track = document.createElement('div');
    track.className = 'track';
    const cg = document.createElement('div');
    cg.className = 'cellgrid';
    cg.style.gridTemplateColumns = `repeat(${N},1fr)`;
    for(let c=0;c<N;c++) cg.appendChild(document.createElement('i'));
    track.appendChild(cg);

    const bar = document.createElement('div');
    bar.className = 'bar-t';
    bar.style.background = phase(t.p).color;
    track.appendChild(bar);

    const paint = ()=>{
      const s = data.tasks[i].s, e = data.tasks[i].e;
      bar.style.left = (s/N*100)+'%';
      bar.style.width = ((e-s+1)/N*100)+'%';
      bar.innerHTML = `<span>W${s+1}${e>s?'–W'+(e+1):''}</span>`;
      ss.value = s; ee.value = e;
    };
    paint();

    if(tc!==null){
      const line = document.createElement('div');
      line.className = 'today';
      line.style.left = (tc/N*100)+'%';
      track.appendChild(line);
    }

    let anchor = null;
    const idxAt = ev => {
      const r = track.getBoundingClientRect();
      return Math.max(0, Math.min(N-1, Math.floor((ev.clientX-r.left)/r.width*N)));
    };
    track.addEventListener('pointerdown', ev=>{
      ev.preventDefault();
      try{ track.setPointerCapture(ev.pointerId); }catch(e){}
      const k = idxAt(ev);
      if(ev.shiftKey){
        anchor = data.tasks[i].s;
        data.tasks[i].s = Math.min(anchor,k);
        data.tasks[i].e = Math.max(anchor,k);
      } else {
        anchor = k;
        data.tasks[i].s = k; data.tasks[i].e = k;
      }
      paint();
    });
    track.addEventListener('pointermove', ev=>{
      if(anchor===null) return;
      const k = idxAt(ev);
      data.tasks[i].s = Math.min(anchor,k);
      data.tasks[i].e = Math.max(anchor,k);
      paint();
    });
    const stop = ()=>{ if(anchor!==null){ anchor = null; save(); } };
    track.addEventListener('pointerup', stop);
    track.addEventListener('pointercancel', stop);
    track.addEventListener('lostpointercapture', stop);

    row.appendChild(track);
    g.appendChild(row);
  });

  const lg = document.getElementById('legend');
  lg.innerHTML = '';
  PHASES.forEach(p=>{
    const s = document.createElement('span');
    s.innerHTML = `<i style="background:${p.color}"></i>${p.name}`;
    lg.appendChild(s);
  });
  document.getElementById('gCount').textContent = `${data.tasks.length} 項工作 · ${N} 週`;
}

      const b = document.createElement('button');
      b.className = 'ico '+(cls||''); b.textContent = txt; b.title = title;
      b.addEventListener('click', fn); return b;
    };
    const swapItems = (a,b)=>{
      data.items.forEach(it=>{ if(it.stage===a) it.stage=-1; });
      data.items.forEach(it=>{ if(it.stage===b) it.stage=a; });
      data.items.forEach(it=>{ if(it.stage===-1) it.stage=b; });
    };
    icons.appendChild(mk('↑','往前移','',()=>{ if(i>0){ swapItems(i,i-1); [data.stages[i-1],data.stages[i]]=[data.stages[i],data.stages[i-1]]; save(); renderList(); renderSkel(); renderGantt(); } }));
    icons.appendChild(mk('↓','往後移','',()=>{ if(i<data.stages.length-1){ swapItems(i,i+1); [data.stages[i+1],data.stages[i]]=[data.stages[i],data.stages[i+1]]; save(); renderList(); renderSkel(); renderGantt(); } }));
    icons.appendChild(mk('＋','在下方插入','',()=>{
      data.stages.splice(i+1,0,{date:'',theme:'',goal:'',act:'',out:'',tools:'',status:'todo',entries:[]});
      data.items.forEach(it=>{ if(it.stage>i) it.stage++; });
      data.tasks.forEach(t=>{ if(t.s>i) t.s++; if(t.e>i) t.e++; });
      save(); renderList(); renderSkel(); renderGantt(); updateGauge();
    }));
    icons.appendChild(mk('✕','刪除這個階段','del',()=>{
      const n = data.items.filter(it=>it.stage===i).length;
      if(confirm(`刪除階段 ${i+1}「${s.theme||'未命名'}」？` + (n?`\n這一階段的 ${n} 項專案產出與實際紀錄會一起刪除。`:''))){
        data.stages.splice(i,1);
        data.items = data.items.filter(it=>it.stage!==i);
        data.items.forEach(it=>{ if(it.stage>i) it.stage--; });
        data.tasks.forEach(t=>{ if(t.s>i) t.s--; if(t.e>=i) t.e--; if(t.e<t.s) t.e=t.s; });
        save(); renderList(); renderSkel(); renderGantt(); updateGauge();
      }
    }));
    tools.appendChild(icons);
    card.appendChild(tools);
    wrap.appendChild(card);
    list.appendChild(wrap);
  });

function renderInds(){
  const box = document.getElementById('inds');
  box.innerHTML = '';
  data.indicators.forEach((d,i)=>{
    const w = document.createElement('div');
    w.className = 'ind';
    w.innerHTML = `<div class="ind-h"><input class="nm"><span class="ind-pct"></span>
        <button class="gx" style="color:var(--ink3)">✕</button></div>
      <div class="meter"><i></i></div>
      <div class="nums">
        <label class="num"><span>前測</span><input class="v pre"></label>
        <label class="num"><span>目前</span><input class="v now"></label>
        <label class="num"><span>目標</span><input class="v tg"></label>
        <label class="num"><span>單位</span><input class="u"></label>
      </div>`;
    const nm = w.querySelector('.nm');
    nm.value = d.name; nm.placeholder = '例：鼻胃管移除率';
    nm.addEventListener('input', ()=>{ data.indicators[i].name = nm.value; save(); });
    function paint(){
      const pre = parseFloat(data.indicators[i].pre), now = parseFloat(data.indicators[i].now), tg = parseFloat(data.indicators[i].target);
      const bar = w.querySelector('.meter i'), lab = w.querySelector('.ind-pct');
      if([pre,now,tg].some(isNaN) || tg===pre){ bar.style.width='0%'; lab.textContent='—'; return; }
      const r = Math.max(0, Math.min(1, (now-pre)/(tg-pre)));
      bar.style.width = (r*100)+'%';
      lab.textContent = Math.round(r*100)+'% 達標';
    }
    const set = (sel,key)=>{
      const el = w.querySelector(sel);
      el.value = d[key] ?? '';
      el.addEventListener('input', ()=>{ data.indicators[i][key] = el.value; save(); paint(); });
    };
    set('.pre','pre'); set('.now','now'); set('.tg','target'); set('.u','unit');
    w.querySelector('.gx').addEventListener('click', ()=>{
      if(confirm('刪除這個指標？')){ data.indicators.splice(i,1); save(); renderInds(); }
    });
    paint();
    box.appendChild(w);
  });
}
function renderSkel(){

function updateGauge(){
  const total = data.items.length;
  const done = data.items.filter(it=>it.done).length;
  const p = total ? done/total : 0;
  document.getElementById('arc').style.strokeDashoffset = (2*Math.PI*33)*(1-p);
  document.getElementById('pct').textContent = Math.round(p*100)+'%';
  const sDone = data.stages.filter(s=>s.status==='done').length;
  const today = new Date(); today.setHours(0,0,0,0);
  const next = data.stages
    .filter(s=>s.date && s.status!=='done' && new Date(s.date+'T00:00:00')>=today)
    .sort((a,b)=>a.date.localeCompare(b.date))[0];
  let line;
  if(next){
    const days = Math.round((new Date(next.date+'T00:00:00')-today)/86400000);
    line = `階段 ${sDone} / ${data.stages.length} 完成<br>下一次 ${roc(next.date).split('（')[0]}，${days===0?'就是今天':'還有 '+days+' 天'}`;
  } else {
    line = `階段 ${sDone} / ${data.stages.length} 完成<br>` + (total && done===total ? '專案產出已全數完成' : '尚未設定後續日期');
  }
  document.getElementById('gaugeTxt').innerHTML = `<strong>專案產出 ${done} / ${total}</strong>${line}`;
}

}
function markHere(){
  if(page!=='plan') { document.querySelectorAll('.nlink.here').forEach(e=>e.classList.remove('here')); return; }
  let cur = 0, best = 1e9;
  data.stages.forEach((s,i)=>{
    const el = document.getElementById('stage-'+i);
    if(!el) return;
    const d = Math.abs(el.getBoundingClientRect().top - 120);
    if(d < best){ best = d; cur = i; }
  });
  document.querySelectorAll('.nlink.here').forEach(e=>e.classList.remove('here'));
  const n = document.getElementById('nav-'+cur);
  if(n) n.classList.add('here');
}

/* ── 小幫手 ── */
function itemsOf(i){ return data.items.filter(it=>it.stage===i); }
function currentStage(){
  const t = new Date(); t.setHours(0,0,0,0);
  let cur = 0;
  data.stages.forEach((s,i)=>{ if(s.date && new Date(s.date+'T00:00:00') <= t) cur = i; });
  const upcoming = data.stages.findIndex(s=>s.status!=='done');
  return (upcoming>=0 && upcoming<cur) ? upcoming : cur;
}
const hasNum = s => /\d/.test(s||'');

function diagnose(){
  const F = [];
  const t = new Date(); t.setHours(0,0,0,0);
  const find = n => data.items.find(it=>it.n===n);
  const noteOf = n => (find(n)?.note || '').trim();
  const doneOf = n => !!find(n)?.done;

  // 落後的階段
  const late = data.stages
    .map((s,i)=>({s,i}))
    .filter(o=>o.s.date && new Date(o.s.date+'T00:00:00') < t && o.s.status!=='done');
  if(late.length){
    F.push({t:'warn2', ic:'!', h:`有 ${late.length} 個階段已過日期但未標完成`,
      d:late.map(o=>`W${o.i+1} ${o.s.theme}`).join('、'), go:late[0].i});
  }

  // 現況值
  const cur3 = noteOf(3);
  if(doneOf(3) && !hasNum(cur3)){
    F.push({t:'warn2', ic:'!', h:'現況分析裡沒有出現數字',
      d:'現況值要是實際測得的數據（％或次數），並註明收集方式、期間、樣本數。用推估的最常被退件。', go:1});
  }
  // 專案目的量化
  const g8 = noteOf(8);
  if(g8 && !(hasNum(g8) && /至|到|降至|提升|降低/.test(g8))){
    F.push({t:'warn2', ic:'!', h:'專案目的看起來還不能量化',
      d:'建議寫成：某指標由 X％ 提升／降低至 Y％，於 115 年○月前完成。', go:2});
  }
  // 順序
  if(doneOf(9) && !doneOf(6)){
    F.push({t:'warn2', ic:'!', h:'改善措施先於要因確立完成',
      d:'措施要對應確認過的要因。先補柏拉圖排序，再回頭檢查每條措施對到哪一個要因。', go:2});
  }
  if(doneOf(5) && !doneOf(3)){
    F.push({t:'info', ic:'i', h:'導因分析已做，但現況分析還沒完成',
      d:'魚骨圖的可能原因需要用查檢表回到現場確認，否則要因會變成用猜的。', go:1});
  }
  // 指標
  const ind = data.indicators.filter(d=>(d.name||'').trim());
  if(!ind.length){
    F.push({t:'info', ic:'i', h:'還沒設定成效指標',
      d:'到追蹤頁填指標名稱與前測值，這個數字就是專案目的裡的 X。', track:true});
  } else {
    const noPre = ind.filter(d=>!String(d.pre).trim());
    if(noPre.length) F.push({t:'info', ic:'i', h:'指標缺前測值',
      d:noPre.map(d=>d.name).join('、') + ' 還沒填前測，後面沒辦法做前後比較。', track:true});
  }
  // 文獻
  if(!doneOf(7) && data.stages[2] && new Date(data.stages[2].date+'T00:00:00') < t){
    F.push({t:'info', ic:'i', h:'文獻查證還沒完成',
      d:'文獻要同時支持問題確立與你選的改善方法有效，兩邊都要有出處。', go:1});
  }
  // 沒有實際紀錄
  const past = data.stages.filter(s=>s.date && new Date(s.date+'T00:00:00') <= t);
  const blank = past.filter(s=>!(s.entries||[]).some(e=>(e.did||'').trim()));
  if(past.length && blank.length){
    F.push({t:'info', ic:'i', h:`${blank.length} 個已過的階段沒有實際紀錄`,
      d:'期末反思和成果報告都要靠這些過程資料，當週補比事後回想準確。'});
  }
  if(!F.length) F.push({t:'ok', ic:'✓', h:'目前沒有發現問題', d:'進度、順序與資料完整性看起來都對得上。'});
  return F;
}

function renderFocus(){
  const box = document.getElementById('hFocus');
  box.innerHTML = '';
  const i = currentStage();
  const s = data.stages[i];
  if(!s){ box.innerHTML = '<p class="empty">還沒有階段資料。</p>'; return; }

  const now = document.createElement('div');
  now.className = 'hnow';
  const t = new Date(); t.setHours(0,0,0,0);
  const dd = s.date ? Math.round((new Date(s.date+'T00:00:00')-t)/86400000) : null;
  now.innerHTML = `<div class="w">W${i+1}　${roc(s.date)}</div><div class="t"></div><div class="d"></div>`;
  now.querySelector('.t').textContent = s.theme || '（未命名）';
  now.querySelector('.d').textContent = dd===null ? '' : (dd>0 ? `還有 ${dd} 天` : (dd===0 ? '就是今天' : `已過 ${-dd} 天`));
  box.appendChild(now);

  const un = itemsOf(i).filter(it=>!it.done);
  const h1 = document.createElement('div');
  h1.className = 'hsec';
  h1.textContent = un.length ? '這週要交出的' : '這週的產出已完成';
  box.appendChild(h1);
  un.forEach(it=>{
    const d = document.createElement('div');
    d.className = 'todo';
    d.innerHTML = `<span class="k">${it.n?String(it.n).padStart(2,'0'):'·'}</span><span>${it.name}<br><span style="font-size:12px;color:var(--ink3)">${it.ask||''}</span></span>`;
    d.addEventListener('click', ()=>goStage(i));
    box.appendChild(d);
  });

  const tasks = data.tasks.filter(tk=>tk.s<=i && tk.e>=i);
  if(tasks.length){
    const h2 = document.createElement('div');
    h2.className = 'hsec'; h2.textContent = '甘特圖上這週在跑的工作';
    box.appendChild(h2);
    tasks.forEach(tk=>{
      const d = document.createElement('div');
      d.className = 'todo';
      d.innerHTML = `<span class="k" style="color:${phase(tk.p).color}">■</span><span>${tk.name||'（未命名）'}　<span style="font-size:11.5px;color:var(--ink3)">W${tk.s+1}${tk.e>tk.s?'–W'+(tk.e+1):''}</span></span>`;
      box.appendChild(d);
    });
  }

  const nx = [];
  data.stages.forEach((st,k)=>{ if(k<=i) (st.entries||[]).forEach(e=>{ if((e.next||'').trim()) nx.push({w:k, x:e.next}); }); });
  if(nx.length){
    const h3 = document.createElement('div');
    h3.className = 'hsec'; h3.textContent = '前幾週留下的待辦';
    box.appendChild(h3);
    nx.slice(-5).forEach(o=>{
      const d = document.createElement('div');
      d.className = 'todo';
      d.innerHTML = `<span class="k">W${o.w+1}</span><span>${o.x}</span>`;
      d.addEventListener('click', ()=>goStage(o.w));
      box.appendChild(d);
    });
  }
}
function renderCheck(){
  const box = document.getElementById('hCheck');
  box.innerHTML = '';
  const F = diagnose();
  F.forEach(f=>{
    const d = document.createElement('div');
    d.className = 'flag ' + f.t;
    d.innerHTML = `<i>${f.ic}</i><span><b>${f.h}</b><u>${f.d||''}</u></span>`;
    if(f.go!==undefined){ d.style.cursor='pointer'; d.addEventListener('click', ()=>goStage(f.go)); }
    if(f.track){ d.style.cursor='pointer'; d.addEventListener('click', ()=>setPage('track')); }
    box.appendChild(d);
  });
  const n = F.filter(f=>f.t==='warn2').length;
  const dot = document.getElementById('fabDot');
  dot.textContent = n;
  dot.classList.toggle('on', n>0);
}

function projectContext(){
  const L = [];
  L.push('【實習與專案背景】');
  data.meta.forEach(m=>L.push(`${m.k}：${m.v}`));
  L.push('');
  L.push('【各階段】');
  data.stages.forEach((s,i)=>{
    L.push(`W${i+1} ${roc(s.date)} ${s.theme}（${s.status==='done'?'已完成':s.status==='doing'?'進行中':'未開始'}）`);
    if(s.tools) L.push(`　工具：${s.tools}`);
    (s.entries||[]).forEach(e=>{ if((e.did||'').trim()) L.push(`　實際紀錄：${e.did}`); if((e.next||'').trim()) L.push(`　下次待辦：${e.next}`); });
  });
  L.push('');
  L.push('【專案要素的填寫狀況】');
  data.items.forEach(it=>{
    L.push(`${it.n?String(it.n).padStart(2,'0')+'. ':''}${it.name}（${it.done?'已完成':'未完成'}）：${(it.note||'').trim()||'（空白）'}`);
  });
  const ind = data.indicators.filter(d=>(d.name||'').trim());
  if(ind.length){
    L.push('');
    L.push('【成效指標】');
    ind.forEach(d=>L.push(`${d.name}：前測 ${d.pre||'—'}${d.unit||''}，目前 ${d.now||'—'}${d.unit||''}，目標 ${d.target||'—'}${d.unit||''}`));
  }
  const i = currentStage();
  L.push('');
  L.push(`【現在位置】W${i+1} ${data.stages[i]?.theme||''}，今天 ${new Date().toLocaleDateString('zh-TW')}`);
  return L.join('\n');
}

const SYS = `你是護理／長期照護專案的指導助理，正在協助一位長照碩士在職專班學生完成機構實習專案。
回答用繁體中文，語氣直接、具體，像資深督導在旁邊帶人。
規則：
1. 先看學生已經填的內容，針對那些內容給意見，不要重講一遍通用的專案理論。
2. 指出問題時要說清楚「為什麼這樣會被退件」以及「改成什麼樣子」，能給範例句就給。
3. 專案邏輯的順序不可跳：現況分析要有實測數據 → 問題確立要比對標準值 → 導因分析 → 要因確立（柏拉圖取累積約80%）→ 專案目的要可量化 → 每條改善措施對應一個確認過的要因 → 前後測用同一套工具。
4. 回答控制在 250 字內，除非學生要求詳細。用短段落或條列，不要用表格。
5. 資料空白時就說還沒有資料、需要先補什麼，不要自己編數字。`;

const chat = [];
function pushMsg(cls, text){
  const log = document.getElementById('chatlog');
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  d.scrollIntoView({block:'nearest'});
  return d;
}
async function ask(q){
  if(!q.trim()) return;
  pushMsg('me', q);
  chat.push({role:'user', content: q});
  const think = pushMsg('ai think', '想一下…');
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        system: SYS + "\n\n以下是這位學生目前填寫的專案資料，回答時請根據它：\n" + projectContext(),
        messages: chat.slice(-8)
      })
    });
    const j = await res.json();
    const txt = (j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
    if(!txt) throw new Error('empty');
    think.remove();
    pushMsg('ai', txt);
    chat.push({role:'assistant', content: txt});
  }catch(err){
    think.remove();
    pushMsg('err', '小幫手現在連不上（這個功能需要在 Claude 裡開啟這個檔案才能運作）。「本週焦點」和「體檢」分頁不需要連線，可以照常使用。');
    chat.pop();
  }
}

function migrate(d){
  if(!d.items) d.items = JSON.parse(JSON.stringify(ORIGINAL.items));
  if(!d.tasks) d.tasks = JSON.parse(JSON.stringify(ORIGINAL.tasks));
  if(!d.indicators) d.indicators = JSON.parse(JSON.stringify(ORIGINAL.indicators));
  d.stages.forEach(s=>{
    if(s.tools===undefined) s.tools='';
    if(!Array.isArray(s.entries)) s.entries=[];
  });
  // 舊版的整體日誌 → 依日期併入最接近的階段
  if(Array.isArray(d.logs) && d.logs.length){
    d.logs.forEach(l=>{
      let idx = 0;
      d.stages.forEach((s,i)=>{ if(s.date && l.date && s.date <= l.date) idx = i; });
      d.stages[idx].entries.push({date:l.date||'', did:l.did||'', next:l.next||''});
    });
  }
  delete d.logs;
  return d;
}
